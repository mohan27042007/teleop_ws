# filepath: ~/teleop_ws/src/rover_bringup/config/ekf.yaml
ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom # EKF provides odom -> base_link

    # ------------------------------
    # Wheel Odometry (from wifi_bridge)
    # ------------------------------
    odom0: /odom
    odom0_config: [true,  true,  false, # X, Y tracking
                   false, false, false, # Roll, Pitch, Yaw (trust IMU instead)
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # ------------------------------
    # IMU (from ESP32)
    # ------------------------------
    imu0: /imu/data
      # The IMU hardware is tilted/uncalibrated, causing "Sky" odom.
      # We disable orientation fusion (first 3 args) to assume robot is flat.
    imu0_config: [false, false, false, # x, y, z orientation (DISABLED)
                  true,  true,  true,  # wx, wy, wz (Use Gyro)
                  false, false, false, # ax, ay, az (Use Accel - Optional but safe)
                  true,  true,  true,
                  true,  false, false] # Linear Acceleration X
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

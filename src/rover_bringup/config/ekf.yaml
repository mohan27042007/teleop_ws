# filepath: ~/teleop_ws/src/rover_bringup/config/ekf.yaml
ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom # EKF provides odom -> base_link

    # ------------------------------
    # Wheel Odometry (from wifi_bridge)
    # ------------------------------
    odom0: /odom
    # X, Y, Z, Roll, Pitch, Yaw...
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # ------------------------------
    # IMU (from ESP32)
    # ------------------------------
    imu0: /imu/data
    # The IMU hardware is tilted/uncalibrated, causing "Sky" odom.
    # We disable orientation fusion (first 3 args) to assume robot is flat.
    # config: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # ------------------------------
    # IMU (from ESP32)
    # ------------------------------
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,  # Trust YAW from IMU
                  false, false, false,
                  false, false, true,  # Angular Velocity Z
                  true,  false, false] # Linear Acceleration X
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
```